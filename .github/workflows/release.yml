name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, e.g. v0.1.0
        required: true

jobs:
  macos:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck and test
        run: |
          bun run check
          cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri skips the DMG's Finder styling whenever CI=true. The runner
          # has a GUI session, so opt back in and keep the installer layout.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
          #
          # No Apple variables are set here on purpose. An unset repository
          # secret still defines the environment variable, as an empty string,
          # and Tauri reads "APPLE_CERTIFICATE exists" as "import this
          # certificate" — then fails the whole build on `security import`.
          # Passing nothing is what produces the ad-hoc signature this release
          # is meant to have.
          #
          # To sign and notarize instead, add APPLE_CERTIFICATE,
          # APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID,
          # APPLE_PASSWORD and APPLE_TEAM_ID as secrets, then list them here.
          # Add them only once they all have real values.
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: Archboard ${{ github.event.inputs.tag || github.ref_name }}
          releaseBody: |
            Universal macOS build (Apple Silicon and Intel), macOS 11 or later.

            **This build is ad-hoc signed, not notarized**, so macOS will refuse
            to open it on first launch.

            The reliable way to allow it, on any macOS version:

            ```sh
            xattr -dr com.apple.quarantine /Applications/Archboard.app
            ```

            On macOS 14 and earlier you can instead right-click the app and
            choose Open. That shortcut was removed in macOS 15; there, use the
            command above, or open System Settings › Privacy & Security and
            click "Open Anyway" after the first blocked attempt.
          releaseDraft: true
          prerelease: false
          # One universal binary rather than two downloads.
          args: --target universal-apple-darwin
