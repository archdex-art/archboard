name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, e.g. v0.1.0
        required: true

jobs:
  macos:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck and test
        run: |
          bun run check
          cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri skips the DMG's Finder styling whenever CI=true. The runner
          # has a GUI session, so opt back in and keep the installer layout.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
          #
          # Ad-hoc signing, explicitly. Without this Tauri never runs codesign
          # and the app ships with only the signature the linker applies
          # automatically — identifier `archboard-<hash>`, flag
          # `linker-signed`, and no designated requirement. macOS keys folder
          # permissions to the signing identity, so with nothing stable to key
          # to it re-asks for Desktop access on every single launch.
          #
          # `-` is codesign's ad-hoc identity. It costs nothing, needs no
          # certificate, and produces `com.archboard.desktop` with a real
          # designated requirement, which is all TCC needs to remember a grant.
          APPLE_SIGNING_IDENTITY: "-"
          #
          # APPLE_CERTIFICATE is deliberately absent. An unset repository
          # secret still defines the variable as an empty string, and Tauri
          # reads "it exists" as "import this certificate", then fails the
          # build on `security import`.
          #
          # To sign with a Developer ID and notarize, add APPLE_CERTIFICATE,
          # APPLE_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_PASSWORD and
          # APPLE_TEAM_ID as secrets and list them here — only once they all
          # have real values.
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: Archboard ${{ github.event.inputs.tag || github.ref_name }}
          releaseBody: |
            Universal macOS build (Apple Silicon and Intel), macOS 11 or later.

            **This build is ad-hoc signed, not notarized**, so macOS will refuse
            to open it on first launch.

            The reliable way to allow it, on any macOS version:

            ```sh
            xattr -dr com.apple.quarantine /Applications/Archboard.app
            ```

            On macOS 14 and earlier you can instead right-click the app and
            choose Open. That shortcut was removed in macOS 15; there, use the
            command above, or open System Settings › Privacy & Security and
            click "Open Anyway" after the first blocked attempt.
          releaseDraft: true
          prerelease: false
          # One universal binary rather than two downloads.
          args: --target universal-apple-darwin
