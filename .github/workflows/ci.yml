name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Every supported platform compiles and runs the suite natively. Cross
    # checking from one host is not an option: libsqlite3-sys builds C, so a
    # target without its toolchain fails in the build script rather than in
    # anything that would tell us about this code.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS
          - os: ubuntu-24.04
            label: Linux
          - os: windows-2022
            label: Windows
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Tauri links against the system webview and its GTK stack. Without
      # these the Rust crate does not compile at all on Linux.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The frontend is identical everywhere, so it is checked once rather
      # than three times.
      - name: Typecheck and test the frontend
        if: matrix.os == 'macos-14'
        run: bun run check

      - name: Lint the backend
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test the backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build the frontend
        run: bun run build
