<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!--
    Menu-bar mark: the app icon reduced to what survives at 16 points — the
    state gutter and three rows. Template images are masks, so everything is
    solid black and macOS tints it to match the menu bar.
  -->
  <g fill="#000000">
    <rect x="6" y="7" width="2" height="18" rx="1"/>
    <rect x="11" y="8"  width="15" height="2" rx="1"/>
    <rect x="11" y="12" width="10" height="2" rx="1"/>
    <rect x="11" y="18" width="15" height="2" rx="1"/>
    <rect x="11" y="22" width="10" height="2" rx="1"/>
  </g>
</svg>
